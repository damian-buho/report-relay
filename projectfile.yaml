org:
  projectfile:
    architecture:
      - amd64
      - arm64
    artifacts:
      relay:
        kind: service
        summary:
          en: Report intake and health endpoints
          es: Recepción de informes y endpoints de salud
          uk: Приймання звітів і ендпоінти стану
        ports:
          - port: 8080
            name: intake
            protocol: tcp
          - port: 8081
            name: admin
            path: /healthz
            protocol: tcp
      go-binary:
        command: report-relay
        kind: binary
        path: dist/report-relay
    images:
      # The pipeline runs the real collector and store, so the intake is proved
      # end to end rather than against a stub. Declared here and not in a
      # reusable fragment: only this project wires them together.
      O9S_ALLOY_IMAGE:
        org: o9s
        name: alloy
        path: ${org}/${name}
        flatpath: ${org}-${name}
        tag: $${M6E_BASE_IMAGE_DEFAULT_VERSION}
        registry: SOURCE_DOCKER_REGISTRY
        ref: $${SOURCE_DOCKER_REGISTRY}/${path}:${tag}
      O9S_LOKI_IMAGE:
        org: o9s
        name: loki
        path: ${org}/${name}
        flatpath: ${org}-${name}
        tag: $${M6E_BASE_IMAGE_DEFAULT_VERSION}
        registry: SOURCE_DOCKER_REGISTRY
        ref: $${SOURCE_DOCKER_REGISTRY}/${path}:${tag}
    ci:
      env:
        O9S_ALLOY_IMAGE: ""
        O9S_LOKI_IMAGE: ""
      nodes:
        binaries-are-built:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
        gsa:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
        binaries-are-released:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
    conventions:
      fragments:
        parents:
          - url: ssh://git@kiota.ch/b19/ubuntu.git
    operating-system:
      - linux
    status: experimental
  report-relay: {}
