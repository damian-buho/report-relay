---
name: ${M6E_COMPOSE_PROJECT_NAME}
services:
  damian-buho-report-relay:
    container_name: ${M6E_CONTAINER_INSTANCE}
    image: ${M6E_IMAGE_FULLNAME}
    # Preset: small (1c, 1g) — Go web app, modest working set. Bounded so it can't starve the shared host.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - dev-network
    environment:
      - LANG
      - TZ
networks:
  dev-network:
    name: ${M6E_COMPOSE_PROJECT_NAME}-network
